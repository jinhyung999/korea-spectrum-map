<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한국 주파수 지도</title>
  <meta name="description" content="대한민국 주파수 분배표를 확대하며 둘러보고 검색하는 스펙트럼 지도. 이 대역은 누가 어떤 용도로 쓰는지 찾아보세요.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="page-head">
    <p class="eyebrow">대한민국 주파수 분배표 · 비공식 시각화</p>
    <h1>한국 주파수 지도</h1>
    <p class="lead">
      라디오, 휴대전화, 와이파이, 항공기와 위성이 모두 같은 전파를 나눠 씁니다.
      아래 지도에서 휠이나 손가락으로 확대하며 "이 대역은 누가 무슨 용도로 쓰는가"를 찾아보세요.
    </p>
    <form id="search" class="search" role="search" autocomplete="off">
      <input id="q" type="search" enterkeyhint="search" aria-label="주파수 또는 키워드 검색"
             placeholder="주파수(2.4GHz, 88-108MHz) 또는 키워드(방송, 아마추어)">
      <button type="submit">찾기</button>
    </form>
    <p class="examples">예시:
      <button type="button" class="chip" data-q="2.4GHz">2.4GHz</button>
      <button type="button" class="chip" data-q="88-108MHz">88-108MHz</button>
      <button type="button" class="chip" data-q="방송">방송</button>
      <button type="button" class="chip" data-q="아마추어">아마추어</button>
      <button type="button" class="chip" data-q="이동통신">이동통신</button>
    </p>
    <p id="search-msg" class="search-msg" role="status" aria-live="polite"></p>
  </header>

  <div id="notice" class="notice" hidden></div>
  <div id="error" class="notice error" hidden></div>

  <main>
    <section class="chart-card" aria-label="주파수 스펙트럼 차트">
      <div class="chart-head">
        <span id="view-range" class="view-range"></span>
        <span class="zoom-btns">
          <button type="button" id="zoom-out" aria-label="축소">&minus;</button>
          <button type="button" id="zoom-in" aria-label="확대">+</button>
          <button type="button" id="zoom-reset">전체 보기</button>
        </span>
      </div>
      <div class="chart-wrap">
        <canvas id="chart" tabindex="0" role="application"
                aria-label="주파수 스펙트럼 차트. 좌우 화살표로 이동, 위아래 화살표나 더하기·빼기로 확대·축소, 대괄호로 이전·다음 대역 선택, 엔터로 선택한 대역 확대"></canvas>
        <div id="tip" class="tip" hidden></div>
      </div>
      <canvas id="minimap" class="minimap" aria-hidden="true"></canvas>
      <p class="guide">
        <span class="g-solid"></span>위 칸: 1순위 업무
        <span class="g-hatch"></span>아래 빗금 칸: 2순위 업무
        <span class="g-hint">휠·드래그·두 손가락 벌리기로 확대 · 대역을 누르면 자세히</span>
      </p>
      <div id="legend" class="legend" role="group" aria-label="업무 계열 필터"></div>
    </section>

    <div class="panels">
      <section id="detail" class="panel" aria-label="선택한 대역" aria-live="polite"></section>
      <section id="results" class="panel" aria-label="검색 결과" hidden></section>
    </div>
  </main>

  <footer class="page-foot">
    <p id="source"></p>
    <p>이 페이지는 고시 내용을 보기 쉽게 옮긴 비공식 시각화입니다. 효력이 있는 것은 고시 원문이며, 실제 사용 전에는 반드시 원문을 확인하세요.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
